data:
  dataset: "fantineh/next-day-wildfire-spread"
  train_pat: "next_day_wildfire_spread_train*"
  val_pat: "next_day_wildfire_spread_eval*"
  test_pat: "next_day_wildfire_spread_test*"
  stats_json: "DATA_STATS_train.json"
train:
  k_patch: 9
  batch_size: 64
  n_pos: 64
  n_neg: 64
  steps_per_epoch: 200
  thr_prob: 0.7
  max_tiles_eval: 10
  batch_patches: 256
hpo:
  rung_epochs: [4, 8]
  monitor: "val_f1"
